# Static company site (/volume1/web/sac) served at / and, for old links, at /sac/.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    absolute_redirect off;  # behind Cloudflare the scheme/host seen here is the tunnel's, so redirects stay relative

    # old path prefix keeps working without touching the files
    location = /sac { return 301 /; }
    location ^~ /sac/ { rewrite ^/sac/?(.*)$ /$1 last; }

    # never publish editor backups, Synology metadata, the duplicate public_html copy,
    # or the internal-network helper pages
    location ~* \.bak                      { return 404; }
    location ^~ /@eaDir/                   { return 404; }
    location ^~ /public_html/              { return 404; }
    location = /scan.html                  { return 404; }
    location = /update_url.js              { return 404; }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
