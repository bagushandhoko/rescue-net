    <style>
    .po-wrap { display: grid; gap: 16px; min-width: 0; }
    .po-card { background: #fff; border: 1px solid rgba(104,64,45,.15); border-radius: 12px; padding: 16px; min-width: 0; overflow-wrap: anywhere; }
    .po-card h2 { margin: 0 0 4px; font-size: 19px; }
    .po-card > p.sub { margin: 0 0 12px; color: #7c6458; font-size: 14px; }
    .po-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .po-badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(104,64,45,.2); background: #fff8f4; }
    .po-badge.ok { background: #e6f4ee; border-color: #9fd3b8; color: #1d6b45; }
    .po-badge.lock { background: #f3eee9; color: #5e4b40; }
    .po-kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .po-kpi { border: 1px solid rgba(104,64,45,.15); border-radius: 10px; padding: 10px 12px; background: #fffaf7; }
    .po-kpi b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
    .po-kpi span { font-size: 13px; color: #6d5a50; }
    #poMap { height: 380px; border-radius: 10px; border: 1px solid rgba(104,64,45,.15); }
    .po-legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px; margin-top: 8px; }
    .po-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
    .po-roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .po-role { border: 1px solid rgba(104,64,45,.15); border-radius: 10px; padding: 12px; }
    .po-role h3 { margin: 0 0 4px; font-size: 16px; }
    .po-role ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
    .po-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .po-list li { border-bottom: 1px solid rgba(104,64,45,.12); padding-bottom: 8px; font-size: 14px; }
    .po-list li:last-child { border-bottom: 0; }
    .po-muted { color: #7c6458; font-size: 13px; }
    .po-bar { height: 8px; background: #f1e6df; border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }
    .po-bar i { display: block; height: 100%; background: #e8755a; }
    .po-orgs { display: flex; flex-wrap: wrap; gap: 8px; }
    .po-orgs a { text-decoration: none; }
    .po-cta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .po-pick { display: grid; gap: 8px; }
    .po-pick a { display: block; padding: 10px 12px; border: 1px solid rgba(104,64,45,.15); border-radius: 10px; text-decoration: none; color: inherit; }
    .po-filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 0; font-size: 14px; }
    .po-filter select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(104,64,45,.25); max-width: 100%; }
    .po-two { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  </style>
  <style>
    .rk-chips{display:flex;flex-wrap:wrap;gap:6px}
    .rk-chips button{border:1px solid rgba(104,64,45,.25);background:#fff;border-radius:999px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
    .rk-chips button.on{background:#e8755a;border-color:#e8755a;color:#fff}
    .rk-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px;margin-top:6px}
    .rk-days div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:#6d5a50}
    .rk-days i{display:block;width:70%;background:#e8755a;border-radius:4px 4px 0 0;min-height:2px}
    .rk-tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
    .rk-tl li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid rgba(104,64,45,.1)}
    .rk-ic{width:28px;height:28px;border-radius:50%;background:#fde3d9;display:grid;place-items:center;font-size:14px}
    .rk-tl b{display:block;font-size:14px;overflow-wrap:anywhere}
    .rk-tl small{color:#7c6458;font-size:12px}
    .rk-more{margin-top:10px}
  </style>
