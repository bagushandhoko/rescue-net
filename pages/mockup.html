<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rescue-Net | Mock-up Viewer</title>
  <style>
    :root {
      --rn-bg: #fff4ef;
      --rn-card: rgba(255,255,255,.88);
      --rn-border: rgba(126,72,55,.16);
      --rn-text: #31233d;
      --rn-muted: #7a5146;
      --rn-accent: #e65f3c;
      --rn-accent-2: #b83b25;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,190,150,.35), transparent 28%),
        radial-gradient(circle at 85% 18%, rgba(255,220,180,.38), transparent 28%),
        linear-gradient(135deg, #fff8f3 0%, #ffe9df 42%, #f8d9d4 100%);
      color: var(--rn-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .mock-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .mock-header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      background: rgba(255,248,243,.92);
      border-bottom: 1px solid var(--rn-border);
      box-shadow: 0 10px 30px rgba(126,72,55,.08);
    }

    .mock-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 22px 10px;
    }

    .mock-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 260px;
    }

    .mock-brand img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      border-radius: 16px;
      background: white;
      box-shadow: 0 10px 24px rgba(126,72,55,.14);
    }

    .mock-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mock-brand h1 {
      font-size: 21px;
      margin: 0;
      letter-spacing: -.04em;
    }

    .mock-live-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, var(--rn-accent), var(--rn-accent-2));
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .mock-brand p {
      margin: 2px 0 0;
      color: var(--rn-muted);
      font-size: 12px;
      font-weight: 700;
    }

    .mock-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--rn-border);
      background: rgba(255,255,255,.82);
      color: #6f3929;
      text-decoration: none;
      font-weight: 800;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(126,72,55,.08);
      cursor: pointer;
    }

    .btn.primary {
      border: 0;
      color: white;
      background: linear-gradient(135deg, var(--rn-accent), var(--rn-accent-2));
    }

    .mock-nav-wrap {
      padding: 0 16px 8px;
      overflow: visible;
    }

    .mock-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 3px 10px;
      align-items: center;
      max-height: 66px;
      overflow-y: auto;
      line-height: 1.1;
    }

    .mock-nav a {
      text-decoration: none;
      color: #704033;
      background: transparent;
      border: 0;
      padding: 1px 0;
      border-radius: 0;
      font-size: 10.5px;
      font-weight: 800;
      white-space: nowrap;
      line-height: 1.1;
    }

    .mock-nav a.active {
      color: #b83b25;
      background: transparent;
      box-shadow: none;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .mock-main {
      width: 100%;
      padding: 12px 22px 22px;
      flex: 1;
    }

    .mock-titlebar {
      max-width: 1500px;
      margin: 0 auto 16px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #bf4d32;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .mock-titlebar h2 {
      margin: 0;
      font-size: clamp(28px, 4vw, 54px);
      line-height: 1;
      letter-spacing: -.06em;
    }

    .mock-titlebar p {
      margin: 8px 0 0;
      color: var(--rn-muted);
      font-weight: 650;
      max-width: 820px;
    }

    .mock-image-frame {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      background: rgba(255,255,255,.82);
      border: 1px solid var(--rn-border);
      border-radius: 30px;
      padding: 14px;
      box-shadow: 0 30px 80px rgba(126,72,55,.16);
    }

    .mock-image-frame img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 22px;
      background: white;
    }

    .mock-titlebar,
    .mock-caption {
      display: none;
    }

    .missing {
      min-height: 560px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--rn-muted);
      border-radius: 22px;
      background: repeating-linear-gradient(135deg, #fff7f2 0 14px, #ffece3 14px 28px);
      border: 1px dashed rgba(126,72,55,.28);
      padding: 40px;
      font-weight: 800;
    }

    .mock-titlebar, .mock-caption {
      display: none !important;
    }

    .mock-main {
      padding-top: 10px !important;
    }

    /* Local-only mockup scale (desktop only): domain stays unchanged.
       On phones this must not run — the mobile layout below handles it. */
    @media (min-width: 861px) {
      body.rn-local-access .mock-main {
        transform: scale(1.08);
        transform-origin: top center;
        width: 92.6%;
        margin-left: auto;
        margin-right: auto;
      }

      body.rn-local-access .mock-header {
        transform: scale(0.98);
        transform-origin: top center;
      }
    }

    /* Phone layout: feels like the actual HP screen, not a framed picture.
       Small sticky bar + a single-row screen switcher, image fills the
       width with no card/padding since the crop already is the phone frame. */
    @media (max-width: 860px) {
      .mock-top {
        align-items: center;
        flex-direction: row;
        padding: 8px 12px 6px;
        gap: 10px;
      }

      .mock-brand { min-width: 0; gap: 8px; }
      .mock-brand img { width: 30px; height: 30px; border-radius: 10px; }
      .mock-brand h1 { font-size: 13px; }
      .mock-brand p { display: none; }
      .mock-live-link { font-size: 10px; padding: 3px 8px; }

      .mock-actions { display: none; }

      .mock-nav-wrap {
        padding: 0 10px 8px;
      }

      .mock-nav {
        flex-wrap: nowrap;
        overflow-x: auto;
        max-height: none;
        gap: 0 12px;
        padding-bottom: 2px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .mock-nav::-webkit-scrollbar { display: none; }

      .mock-nav a {
        font-size: 10px;
        flex: 0 0 auto;
      }

      .mock-main {
        padding: 0 !important;
      }

      .mock-image-frame {
        max-width: 420px;
        margin: 6px auto 0;
        background: transparent;
        border: 0;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
      }

      .mock-image-frame img {
        border-radius: 0;
        background: transparent;
      }
    }

</style>
</head>
<body class="mockup-viewer">
<div class="mock-shell">
  <header class="mock-header">
    <div class="mock-top">
      <div class="mock-brand">
        <img src="../assets/img/rn-logo.png" alt="Rescue-Net">
        <div>
          <div class="mock-title-row">
            <h1>Rescue-Net Mock-up</h1>
            <a class="mock-live-link" href="war-room.html?event=event-sim-001">Live Prototype</a>
          </div>
          <p>Blueprint Static Design Viewer</p>
        </div>
      </div>

      <div class="mock-actions">
        <a class="btn" href="../index.html">Welcome Live</a>
      <a href="data-consolidation.html?event=event-sim-001">Data Konsolidasi</a>
      </div>
    </div>

    <div class="mock-nav-wrap">
      <div class="mock-nav" id="mockNav"></div>
    </div>
  </header>

  <main class="mock-main">
    <section class="mock-titlebar">
      <p class="eyebrow">Static Design Reference</p>
      <h2 id="mockTitle">Mock-up</h2>
      <p id="mockSubtitle">Tampilan statis berdasarkan blueprint RN.</p>
    </section>

    <section class="mock-image-frame" id="mockFrame">
      <img id="mockImage" src="" alt="">
    </section>

    <section class="mock-caption" id="mockCaption"></section>
  </main>
</div>

<script src="../assets/js/mockup.js?v=fix-20260820b"></script>
<script src="../assets/js/rn-public-header.js?v=eventpicker-20260831"></script>
<script src="../assets/js/rn-layout-mode.js?v=fix-20260820b"></script>
</body>
</html>
