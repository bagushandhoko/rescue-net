  <title>Rescue-Net | Lacak Logistik</title>

  <style>
    body { background: var(--bg, #fff6ef); color: var(--text, #2d211b); margin: 0;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
    .ll-wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
    .ll-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .ll-brand img { height: 34px; width: auto; }
    .ll-brand b { font-size: 15px; }
    .ll-brand span { color: var(--muted, #7c6458); font-size: 13px; display: block; }
    .ll-card { border: 1px solid var(--line, rgba(104,64,45,.14)); border-radius: 14px;
      background: var(--panel2, #fff8f3); padding: 16px; margin-bottom: 14px; }
    .ll-trace { font-family: monospace; font-weight: 700; font-size: 20px; letter-spacing: 1px; }
    .ll-status { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 999px;
      font-size: 13px; font-weight: 700; border: 1px solid var(--line2, rgba(120,80,60,.22)); }
    .ll-status.done { color: #2f9e59; border-color: #2f9e59; }
    .ll-status.transit { color: #b88918; border-color: #b88918; }
    .ll-status.cancel { color: #c0392b; border-color: #c0392b; }
    .ll-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0;
      border-top: 1px solid var(--line, rgba(104,64,45,.14)); font-size: 13px; }
    .ll-row:first-of-type { border-top: 0; }
    .ll-row span { color: var(--muted, #7c6458); flex: 0 0 auto; }
    .ll-row b { text-align: right; font-weight: 600; }
    .ll-timeline { list-style: none; margin: 4px 0 0; padding: 0; }
    .ll-step { position: relative; padding: 0 0 18px 26px; }
    .ll-step:last-child { padding-bottom: 0; }
    .ll-step::before { content: ""; position: absolute; left: 6px; top: 3px; width: 11px; height: 11px;
      border-radius: 50%; border: 2px solid var(--line2, rgba(120,80,60,.22)); background: var(--panel2, #fff8f3); }
    .ll-step::after { content: ""; position: absolute; left: 11px; top: 16px; bottom: 0; width: 2px;
      background: var(--line, rgba(104,64,45,.14)); }
    .ll-step:last-child::after { display: none; }
    .ll-step.done::before { background: #2f9e59; border-color: #2f9e59; }
    .ll-step.done::after { background: #2f9e59; }
    .ll-step.current::before { background: #b88918; border-color: #b88918; box-shadow: 0 0 0 3px rgba(184,137,24,.25); }
    .ll-step h4 { margin: 0; font-size: 13.5px; }
    .ll-step time { color: var(--muted, #7c6458); font-size: 13px; }
    .ll-muted { color: var(--muted, #7c6458); font-size: 13px; }
    .ll-err { color: #c0392b; font-size: 14px; }
    .ll-find { margin-top: 12px; display: flex; gap: 8px; }
    .ll-find input { flex: 1; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line, rgba(104,64,45,.14));
      background: var(--panel, #fff); color: inherit; font: inherit; }
    .ll-find button { padding: 9px 14px; border-radius: 9px; border: 0; background: var(--blue, #3b82c4); color: #fff;
      font-weight: 600; cursor: pointer; }
  </style>
  <link rel="stylesheet" href="../assets/css/rn-mobile-drawer.css?v=font-20261109" />
  <link rel="icon" type="image/png" sizes="32x32" href="/rescue-net/assets/img/favicon/favicon-32.png?v=20261114">
  <link rel="icon" type="image/png" sizes="48x48" href="/rescue-net/assets/img/favicon/favicon-48.png?v=20261114">
  <link rel="apple-touch-icon" href="/rescue-net/assets/img/favicon/favicon-180.png?v=20261114">
</head>
<body>
  <div class="ll-wrap">
    <div class="ll-brand">
      <img src="../assets/img/rn-logo-web.png" alt="Rescue-Net">
      <div><b>Rescue-Net</b><span>Pelacakan Logistik Bantuan</span></div>
    </div>

    <div id="llBody">
      <p class="ll-muted" id="llLoading">Memuat data kiriman…</p>
    </div>

    <div class="ll-card" id="llFindCard" hidden>
      <!-- audit SOP 12 Nov (S7): halaman tanpa judul/penjelasan -> warga tidak tahu kode apa yang dimasukkan -->
      <h1 style="font-size:22px;margin:0 0 6px">Lacak Kiriman Bantuan</h1>
      <p class="ll-muted" style="margin-top:0">Masukkan <b>kode trace</b> kiriman (bentuk <code>RN-XXXXXXXX</code>). Kode ini tercetak di label/QR paket, atau minta ke petugas posko pengirim. Hasilnya menunjukkan posisi dan status kiriman, termasuk serah terima.</p>
      <div class="ll-find">
        <input id="llFindInput" placeholder="RN-XXXXXXXX" autocomplete="off">
        <button id="llFindBtn" type="button">Lacak</button>
      </div>
    </div>
  </div>

</body>
</html>
