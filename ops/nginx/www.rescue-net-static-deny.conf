# Rescue-Net static site: the web root /volume1/web/rescue-net is the git
# checkout, so without this every repo file (.git, backend source, docs,
# scripts, ops) is downloadable at /rescue-net/<path>. Only index.html,
# manifest.webmanifest, sw.js, pages/ and assets/ are the public site.
# Installed by scripts/rn-install-nginx-deny.sh into
# /usr/local/etc/nginx/conf.d/ (included inside the Web Station server block;
# regex locations win over the default prefix location).

# hidden files and folders (.git, .claude, .gitignore, ...) and Synology @eaDir thumbnails
location ~ ^/rescue-net/(.*/)?(\.|@eaDir) {
    return 404;
}

# everything in the repo that is not the website
location ~ ^/rescue-net/(frappe_shadow|docs|ops|scripts|apps|backup|backups|blueprint|scratchpad|data|_sandbox_desain)(/|$) {
    return 404;
}

# repo files at the root, and source/archive files anywhere under the site
location ~ ^/rescue-net/[^/]+\.(md|txt|sh)$ {
    return 404;
}
location ~ ^/rescue-net/.*\.(py|pyc|yml|yaml|zip|tgz|gz|sql|dump|bak|log|env)$ {
    return 404;
}
