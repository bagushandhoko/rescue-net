# Build the Rescue-Net Android app (Capacitor wrapper in apps/rescue-net-shell)
# and publish it as the GitHub Release "apk-latest" -> stable download link:
#   https://github.com/bagushandhoko/rescue-net/releases/download/apk-latest/rescue-net.apk
# The app opens https://rescue-net.online (server.url), so a new APK is only
# needed when the wrapper itself changes — website updates reach the app live.
#
# Signing: with the repository secrets ANDROID_KEYSTORE_B64 (base64 of a .jks),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD the APK
# is a signed release that can be updated in place. Without them a debug-signed
# APK is built (fine for testing; an update may need uninstall first).
name: android-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/rescue-net-shell/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/rescue-net-shell
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Add Android platform
        run: |
          npm run prepare-www
          npx cap add android
          npx cap sync android
      - name: Version from run number
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${GITHUB_RUN_NUMBER}/" $G
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" $G
          grep -E "versionCode|versionName" $G
      - name: Build signed release
        if: env.HAS_KEY == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rn.jks"
          cd android && ./gradlew --no-daemon assembleRelease
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/rn.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS --out "$GITHUB_WORKSPACE/rescue-net.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/rn.jks"
      - name: Build debug (no signing key configured)
        if: env.HAS_KEY != 'true'
        run: |
          cd android && ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/rescue-net.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: rescue-net-apk
          path: rescue-net.apk
      - name: Publish release apk-latest
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Rescue-Net Android (build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}). Aplikasi membuka https://rescue-net.online — pembaruan website langsung masuk tanpa install ulang."
          if [ "$HAS_KEY" != "true" ]; then NOTE="$NOTE Build uji (debug-signed)."; fi
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Rescue-Net Android" --notes "$NOTE" --latest
          gh release edit apk-latest --notes "$NOTE"
          gh release upload apk-latest rescue-net.apk --clobber
