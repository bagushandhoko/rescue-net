# Runs the rescue_net test suite on every PR / push to main, with the same
# isolated stack used locally on the VM (scripts/rn-test-stack.sh):
# MariaDB (utf8mb4) + Redis + a frappe/erpnext:v15 bench, app source from git.
name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  rescue-net-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Start test stack + create site
        run: sh scripts/rn-test-stack.sh init
      - name: Run tests
        run: sh scripts/rn-test-stack.sh test
      - name: Stop test stack
        if: always()
        run: sh scripts/rn-test-stack.sh down
